name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Lint
        run: |
          python -m pip install --quiet ruff
          ruff check src tests
      - name: Run unit tests with coverage
        run: |
          python -m pip install --quiet "coverage[toml]"
          coverage run --source=src -m unittest discover -s tests
          coverage report --fail-under=60
      - name: Run unit tests (verbose, as documented)
        run: python -m unittest discover -s tests -v

  package:
    # Verify the artefact users actually get: build the sdist and the wheel,
    # install the wheel into a clean environment and smoke-test the console
    # script. Editable installs hide packaging bugs (missing data files,
    # broken entry points), which is exactly what this job catches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/albo-search --version
          /tmp/clean/bin/albo --help
      - name: Verify bundled data files are present in the wheel
        run: |
          /tmp/clean/bin/python -c "import albo_search, json, pathlib; \
            p = pathlib.Path(albo_search.__file__).parent / 'data' / 'sources.json'; \
            d = json.loads(p.read_text()); print('sources.json ok, keys:', sorted(d)); \
            assert d"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
