[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "albo-search"
version = "0.1.0"
description = "Query Italian public professional registers (lawyers, accountants, administrators) from the CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "albo-search contributors" }]
keywords = ["italy", "albo", "avvocati", "commercialisti", "registries", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
albo-search = "albo_search.cli:main"
albo = "albo_search.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
albo_search = ["data/*.json"]
