[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "albo-search"
version = "0.2.0"
description = "Query Italian public professional registers (lawyers, accountants, administrators) from the CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "albo-search contributors" }]
keywords = [
  "italy", "albo", "avvocati", "commercialisti", "cassa-forense",
  "registries", "cli", "compliance", "kyc", "open-data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["build>=1.2", "twine>=5.1"]

[project.scripts]
albo-search = "albo_search.cli:main"
albo = "albo_search.cli:main"

[project.urls]
Homepage = "https://jack89-ml.github.io/#products"
Repository = "https://github.com/jack89-ML/albo-search"
Issues = "https://github.com/jack89-ML/albo-search/issues"
Changelog = "https://github.com/jack89-ML/albo-search/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
albo_search = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "RET", "ARG", "S", "UP", "ISC", "PIE", "RUF"]
ignore = [
  "E501",       # line length is a formatting concern, reviewed by hand
  "S101",       # asserts are the test framework
  "S603", "S607",   # subprocess with a fixed argv, never a shell
  "S310",       # urlopen on user-configured registry endpoints
  "S311",       # random is used for jitter, not for crypto
  "B904",       # raise-from in retry paths would only add noise
  "SIM105", "S110",   # reactive waits swallow the timeout by design
  "RUF012",
  "RUF001", "RUF002", "RUF003",   # typographic apostrophes/dashes in Italian copy
]

[tool.ruff.lint.per-file-ignores]
# test doubles mirror the real signatures and use temp paths by design
"tests/*" = ["ARG002", "S108", "SIM117"]
